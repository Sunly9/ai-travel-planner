# ============================================================
# application.yml 配置模板
# 
# 使用方法：
#   1. 复制本文件为 application.yml
#   2. 把下面的占位符替换成你自己的真实值
#   3. 真实的 application.yml 不要提交到 GitHub（已被 .gitignore 忽略）
#
# 或者通过环境变量配置（推荐生产环境用）：
#   export LLM_API_KEY=sk-xxx
#   export DB_PASSWORD=your-password
#   ...
# ============================================================

server:
  port: 3200

llm:
  # 任何「OpenAI 兼容」的云端服务都能直接用，只改下面三个值。
  # 常用选项（都不需要先充值）：
  #
  # ① 硅基流动 SiliconFlow（默认）—— 需要账户有余额
  #    base-url: https://api.siliconflow.cn/v1
  #    model:    Pro/zai-org/GLM-5.1
  #
  # ② 智谱 BigModel —— glm-4-flash 是免费模型（https://open.bigmodel.cn）
  #    base-url: https://open.bigmodel.cn/api/paas/v4
  #    model:    glm-4-flash
  #
  # ③ 阿里云百炼 —— 新用户各模型有免费 token 额度（https://bailian.console.aliyun.com）
  #    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #    model:    qwen-plus
  #
  # ④ ModelScope 魔搭 —— 有免费推理额度（https://modelscope.cn）
  #    base-url: https://api-inference.modelscope.cn/v1
  #    model:    Qwen/Qwen2.5-7B-Instruct
  base-url: https://api.siliconflow.cn/v1
  model: Pro/zai-org/GLM-5.1
  # 对应平台的 API Key
  api-key: YOUR_LLM_API_KEY

spring:
  datasource:
    # MySQL 连接
    url: jdbc:mysql://localhost:3306/travel?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: YOUR_MYSQL_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update  # 开发用 update，生产环境改 validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  # JWT 密钥，随便填一串字符（建议 50 位以上）
  secret: YOUR_JWT_SECRET_AT_LEAST_50_CHARS
  expiration: 86400000  # 1 天（毫秒）

amap:
  # 高德开放平台 Web服务 Key（去 https://open.amap.com 申请，免费）
  key: YOUR_AMAP_KEY

geo:
  # 地理编码缓存有效期（天）
  cache-ttl-days: 30
