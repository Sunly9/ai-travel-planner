spring:
  datasource:
    # H2 内存库：跑测试不需要本地 MySQL
    # NON_KEYWORDS=USER 是因为表名叫 user，在 H2 里是保留字
    url: jdbc:h2:mem:travel_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

jwt:
  secret: test-secret-key-at-least-50-characters-long-for-hmac-sha
  expiration: 86400000

llm:
  base-url: http://127.0.0.1:1
  model: test-model
  api-key: test-api-key

amap:
  key: test-amap-key

geo:
  cache-ttl-days: 30

logging:
  level:
    root: warn
    org.example.travel_project1: warn
